name: Build and Release

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag name for release (leave empty for artifacts only)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_SDK_VERSION: '36'
  BUILD_TOOLS_VERSION: '36.0.0'
  NDK_VERSION: '28.2.13676358'
  CMDLINE_TOOLS_VERSION: '12266719'

jobs:
  # Job 1: Native kütüphaneleri paralel build et
  build-native-libs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lib: [tun2socks, hysteria2]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: ${{ env.CMDLINE_TOOLS_VERSION }}
          packages: 'platforms;android-${{ env.ANDROID_SDK_VERSION }} build-tools;${{ env.BUILD_TOOLS_VERSION }} platform-tools'

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --channel=0 \
            --install "ndk;${{ env.NDK_VERSION }}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV

      # Build tun2socks
      - name: Restore cached libtun2socks
        if: matrix.lib == 'tun2socks'
        id: cache-tun2socks
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/libs
          key: libtun2socks-${{ runner.os }}-${{ env.NDK_VERSION }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('.git/modules/badvpn/HEAD') }}-${{ hashFiles('.git/modules/libancillary/HEAD') }}

      - name: Build libtun2socks
        if: matrix.lib == 'tun2socks' && steps.cache-tun2socks.outputs.cache-hit != 'true'
        run: bash compile-tun2socks.sh

      - name: Save libtun2socks cache
        if: matrix.lib == 'tun2socks' && steps.cache-tun2socks.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/libs
          key: ${{ steps.cache-tun2socks.outputs.cache-primary-key }}

      - name: Upload libtun2socks
        if: matrix.lib == 'tun2socks'
        uses: actions/upload-artifact@v4
        with:
          name: libtun2socks
          path: ${{ github.workspace }}/libs
          retention-days: 1

      # Build hysteria2
      - name: Setup Golang
        if: matrix.lib == 'hysteria2'
        uses: actions/setup-go@v5
        with:
          go-version-file: 'AndroidLibXrayLite/go.mod'
          cache: true

      - name: Restore cached libhysteria2
        if: matrix.lib == 'hysteria2'
        id: cache-hysteria2
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/hysteria/libs
          key: libhysteria2-${{ runner.os }}-${{ env.NDK_VERSION }}-${{ hashFiles('.git/modules/hysteria/HEAD') }}-${{ hashFiles('libhysteria2.sh') }}

      - name: Build libhysteria2
        if: matrix.lib == 'hysteria2' && steps.cache-hysteria2.outputs.cache-hit != 'true'
        run: bash libhysteria2.sh

      - name: Save libhysteria2 cache
        if: matrix.lib == 'hysteria2' && steps.cache-hysteria2.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/hysteria/libs
          key: ${{ steps.cache-hysteria2.outputs.cache-primary-key }}

      - name: Upload libhysteria2
        if: matrix.lib == 'hysteria2'
        uses: actions/upload-artifact@v4
        with:
          name: libhysteria2
          path: ${{ github.workspace }}/hysteria/libs
          retention-days: 1

  # Job 2: libv2ray'i indir
  download-libv2ray:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Fetch AndroidLibXrayLite tag
        run: |
          pushd AndroidLibXrayLite
          CURRENT_TAG=$(git describe --tags --abbrev=0)
          echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
          popd

      - name: Download libv2ray
        uses: robinraju/release-downloader@v1
        with:
          repository: '2dust/AndroidLibXrayLite'
          tag: ${{ env.CURRENT_TAG }}
          fileName: 'libv2ray.aar'
          out-file-path: libs/

      - name: Upload libv2ray
        uses: actions/upload-artifact@v4
        with:
          name: libv2ray
          path: libs/libv2ray.aar
          retention-days: 1

  # Job 3: APK build
  build-apk:
    needs: [build-native-libs, download-libv2ray]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: ${{ env.CMDLINE_TOOLS_VERSION }}
          packages: 'platforms;android-${{ env.ANDROID_SDK_VERSION }} build-tools;${{ env.BUILD_TOOLS_VERSION }} platform-tools'

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --channel=0 \
            --install "ndk;${{ env.NDK_VERSION }}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV

      - name: Configure NDK in build.gradle
        run: |
          sed -i '18i\
          \
              ndkVersion = "${{ env.NDK_VERSION }}"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

      # Download tüm native lib'leri
      - name: Download libtun2socks
        uses: actions/download-artifact@v4
        with:
          name: libtun2socks
          path: ${{ github.workspace }}/V2rayNG/app/libs

      - name: Download libhysteria2
        uses: actions/download-artifact@v4
        with:
          name: libhysteria2
          path: ${{ github.workspace }}/V2rayNG/app/libs

      - name: Download libv2ray
        uses: actions/download-artifact@v4
        with:
          name: libv2ray
          path: ${{ github.workspace }}/V2rayNG/app/libs

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build APK
        run: |
          cd ${{ github.workspace }}/V2rayNG
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease \
            --no-daemon \
            --parallel \
            --max-workers=4 \
            --build-cache \
            --configuration-cache

      - name: Verify and list APK outputs
        run: |
          echo "📦 Built APK files:"
          ls -lh ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/release/*.apk

      # ============================================
      # ARTIFACTS UPLOAD (ZIP'siz, direkt APK)
      # Sadece release_tag boş ise yükle
      # ============================================
      - name: Upload APKs as artifacts
        if: github.event.inputs.release_tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: all-apks
          path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/release/*.apk
          retention-days: 7
          compression-level: 0  # ZIP'leme! Direkt APK yükle

      # ============================================
      # GITHUB RELEASE (Direkt APK'lar)
      # Sadece release_tag doluysa release oluştur
      # ============================================
      - name: Create GitHub Release
        if: github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: Release ${{ github.event.inputs.release_tag }}
          body: |
            ## 🚀 Release ${{ github.event.inputs.release_tag }}
            
            ### 📱 APK Downloads
            Choose the APK for your device:
            - **arm64-v8a** - Most modern Android devices (Recommended)
            - **armeabi-v7a** - Older 32-bit ARM devices
            - **x86** - Intel/AMD 32-bit devices (rare)
            - **x86_64** - Intel/AMD 64-bit devices (emulators)
            - **universal** - Works on all devices (larger file size)
            
            ### ℹ️ Build Information
            - **Commit**: `${{ github.sha }}`
            - **Branch**: `${{ github.ref_name }}`
            - **Build Date**: ${{ github.event.head_commit.timestamp }}
            - **NDK**: ${{ env.NDK_VERSION }}
            - **SDK**: Android ${{ env.ANDROID_SDK_VERSION }}
            
            ### 📝 Installation
            1. Download the APK for your device architecture
            2. Enable "Install from Unknown Sources" in Android settings
            3. Install the APK
            
            > **Note**: If unsure which version to download, choose `universal.apk`
          draft: false
          prerelease: false
          make_latest: true
          files: |
            ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/release/*.apk
            
